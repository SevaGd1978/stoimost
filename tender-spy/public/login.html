<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — Tender Spy</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🕵️%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <div class="brand">
        <div class="brand-icon">🕵️</div>
        <div>
          <div class="brand-title">Tender <span>Spy</span></div>
          <div class="brand-sub" id="login-sub">Вход для сотрудников</div>
        </div>
      </div>

      <form class="form mt" id="form-login" hidden>
        <div class="field">
          <label for="login">Логин</label>
          <input class="input" id="login" name="login" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Пароль</label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <p class="login-error" id="login-error"></p>
        <button class="btn btn-primary btn-block" type="submit">Войти</button>
      </form>

      <form class="form mt" id="form-setup" hidden>
        <p class="muted small">Пользователей ещё нет. Создайте учётную запись администратора — она управляет сотрудниками, номенклатурой и настройками.</p>
        <div class="field">
          <label for="setup-login">Логин <span class="hint">латиница, от 3 символов</span></label>
          <input class="input" id="setup-login" name="login" autocomplete="username" required placeholder="admin" />
        </div>
        <div class="field">
          <label for="setup-name">Имя</label>
          <input class="input" id="setup-name" name="name" autocomplete="name" placeholder="Администратор" />
        </div>
        <div class="field">
          <label for="setup-password">Пароль <span class="hint">от 8 символов</span></label>
          <input class="input" id="setup-password" name="password" type="password" autocomplete="new-password" required />
        </div>
        <div class="field">
          <label for="setup-password2">Пароль ещё раз</label>
          <input class="input" id="setup-password2" name="password2" type="password" autocomplete="new-password" required />
        </div>
        <p class="login-error" id="setup-error"></p>
        <button class="btn btn-primary btn-block" type="submit">Создать администратора</button>
      </form>
    </div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    async function post(url, body) {
      const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      return data;
    }
    $('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('login-error').textContent = '';
      try {
        await post('/api/login', { login: $('login').value, password: $('password').value });
        location.assign('/');
      } catch (err) {
        $('login-error').textContent = err.message;
      }
    });
    $('form-setup').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('setup-error').textContent = '';
      if ($('setup-password').value !== $('setup-password2').value) {
        $('setup-error').textContent = 'Пароли не совпадают';
        return;
      }
      try {
        await post('/api/setup', {
          login: $('setup-login').value,
          name: $('setup-name').value,
          password: $('setup-password').value,
        });
        location.assign('/');
      } catch (err) {
        $('setup-error').textContent = err.message;
      }
    });
    fetch('/api/setup')
      .then((r) => r.json())
      .then((data) => {
        const setup = Boolean(data.needsSetup);
        $('form-setup').hidden = !setup;
        $('form-login').hidden = setup;
        $('login-sub').textContent = setup ? 'Первый запуск' : 'Вход для сотрудников';
        (setup ? $('setup-login') : $('login')).focus();
      })
      .catch(() => {
        $('form-login').hidden = false;
        $('login-error').textContent = 'Не удалось связаться с сервером';
      });
  </script>
</body>
</html>
