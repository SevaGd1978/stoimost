name: Tests

on:
  push:
    branches: [main]
    paths: ['tender-spy/**']
  pull_request:
    paths: ['tender-spy/**']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        working-directory: tender-spy
        run: npm ci
      - name: Run tests
        working-directory: tender-spy
        run: npm test
